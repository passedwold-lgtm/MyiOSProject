name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git ~/theos/sdks

    - name: Build Project for iOS 26
      run: |
        export THEOS=~/theos
        export ARCHS=arm64
        export TARGET=iphone:clang:latest:26
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: iOS-Tweak-Package-iOS26
        path: |
          packages/*.deb
          .theos/obj/install/*.dylib
          .theos/obj/debug/*.dylib

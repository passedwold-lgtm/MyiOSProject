name: Build iOS dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git <LaTex>$HOME/theos
        echo "THEOS=$</LaTex>HOME/theos" >> <LaTex>$GITHUB_ENV
        echo "$</LaTex>HOME/theos/bin" >> <LaTex>$GITHUB_PATH

    - name: Setup iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git $</LaTex>HOME/theos/sdks

    - name: Build dylib
      run: |
        export THEOS=<LaTex>$HOME/theos
        make clean
        make -j$</LaTex>(sysctl -n hw.ncpu)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FF-dylib
        path: .theos/obj/debug/*.dylib
        if-no-files-found: error
